plugins {
    alias libs.plugins.android.application
    alias libs.plugins.google.gms.google.services
}


android {
    compileSdk = 37
    signingConfigs {
        config {
            keyAlias 'arcltd'
            keyPassword '123456789'
            storePassword '123456789'
            storeFile rootProject.file('arc_jks.jks')
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    
    ndkVersion = "28.0.12433566"
    defaultConfig {
        applicationId "com.arcltd.staff"
        minSdk = 31
        targetSdk = 37
        versionCode 35
        versionName "2.24"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures{
        //noinspection DataBindingWithoutKapt
        dataBinding = true
        buildConfig = true
    }
    namespace 'com.arcltd.staff'

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    bundle {
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // Core AndroidX
    implementation libs.play.services.base
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.core.ktx
    implementation libs.activity.ktx
    implementation libs.gridlayout
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.cardview
    // implementation libs.legacy.support.v4
    // implementation libs.legacy.support.v13

    // Architecture Components
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    // implementation libs.lifecycle.extensions1
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx
    implementation libs.work.runtime

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    implementation libs.firebase.auth
    //noinspection LoginCredentials
    implementation libs.play.services.auth
    implementation libs.play.services.location

    // QR Code & Barcode Scanning (ZXing)
    implementation libs.zxing.core
    implementation libs.zxing.android

    // Networking (Retrofit, OkHttp, Volley)
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.converter.scalars
    implementation libs.adapter.rxjava2
    implementation libs.okhttp
    implementation libs.gson
    implementation libs.volley
    implementation libs.rxandroid

    // Room Database
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.room.rxjava3

    // UI & Image Loading
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation libs.circleimageview
    implementation libs.material.ripple
    implementation libs.photoview
    implementation libs.ssp.android
    implementation libs.sdp.android
    implementation libs.library
    // implementation libs.nineoldandroids.library

    // PDF & Documents
    implementation libs.pdf.viewer.fragment
    implementation libs.jsoup

    // Other Tools
    implementation libs.biometric
    implementation libs.dexter
    implementation libs.app.update
    implementation libs.app.update.ktx
    implementation libs.recaptcha
    implementation libs.threetenabp
    annotationProcessor libs.annotation

    // Kotlin (even if mostly Java, some libs might need it)
    implementation(platform(libs.kotlin.bom))

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
